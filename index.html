<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Καταγραφή Συμβάντων</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #f0f2f5;
margin: 0;
padding: 15px;
display: flex;
flex-direction: column;
align-items: center;
}
.container, .archive-container {
background: white;
padding: 20px;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0,0,0,0.05);
width: 100%;
max-width: 600px;
margin-bottom: 20px;
box-sizing: border-box;
}
h2 {
margin-top: 0;
color: #1e293b;
text-align: center;
font-size: 1.4rem;
}
.form-group { margin-bottom: 15px; }
.form-row { display: flex; gap: 15px; }
.form-row .form-group { flex: 1; }
label {
display: block;
margin-bottom: 6px;
font-weight: 600;
color: #475569;
font-size: 0.9rem;
}
input[type="text"], input[type="datetime-local"], textarea {
width: 100%;
padding: 12px;
border: 1px solid #cbd5e1;
border-radius: 8px;
box-sizing: border-box;
font-family: inherit;
font-size: 1rem;
background-color: #f8fafc;
}
textarea { resize: vertical; height: 100px; }
button.btn-submit {
width: 100%;
padding: 14px;
background-color: #4f46e5;
color: white;
border: none;
border-radius: 8px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
margin-top: 10px;
}
button.btn-submit:hover { background-color: #4338ca; }
.header-actions {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 15px;
}
button.btn-excel {
background-color: #107c41;
color: white;
border: none;
padding: 10px 16px;
border-radius: 8px;
font-weight: bold;
cursor: pointer;
}
.event-card {
background: #fff;
border: 1px solid #e2e8f0;
border-radius: 8px;
padding: 15px;
margin-bottom: 15px;
position: relative;
}
.event-card h3 { margin: 0 0 10px 0; color: #1e293b; font-size: 1.1rem; }
.event-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
font-size: 0.85rem;
color: #64748b;
}
.event-grid div span { font-weight: 600; color: #334155; display: block; }
.event-details {
font-size: 0.9rem;
color: #334155;
background: #f8fafc;
padding: 10px;
border-radius: 6px;
border-left: 3px solid #cbd5e1;
margin-top: 8px;
white-space: pre-wrap;
}
.btn-delete {
position: absolute;
top: 15px;
right: 15px;
background-color: #fee2e2;
color: #ef4444;
border: none;
padding: 6px 12px;
border-radius: 6px;
cursor: pointer;
}
.no-events { text-align: center; color: #94a3b8; font-style: italic; padding: 20px; }
.status-bar { font-size: 0.8rem; text-align: center; color: #64748b; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="container">
<h2>Καταγραφή Συμβάντος</h2>
<div id="statusBar" class="status-bar">Σύνδεση...</div>
<form id="eventForm">
<div class="form-group">
<label for="eventTitle">Τίτλος Συμβάντος / Σκοπός:</label>
<input type="text" id="eventTitle" required>
</div>
<div class="form-row">
<div class="form-group">
<label for="eventDateTime">Ημερομηνία & Ώρα:</label>
<input type="datetime-local" id="eventDateTime" required>
</div>
<div class="form-group">
<label for="eventDuration">Διάρκεια:</label>
<input type="text" id="eventDuration" required placeholder="π.χ. 1 ώρα">
</div>
</div>
<div class="form-row">
<div class="form-group">
<label for="eventVehicle">Όχημα:</label>
<input type="text" id="eventVehicle" required>
</div>
<div class="form-group">
<label for="eventCrew">Πλήρωμα:</label>
<input type="text" id="eventCrew" required>
</div>
</div>
<div class="form-group">
<label for="eventDetails">Λεπτομέρειες:</label>
<textarea id="eventDetails"></textarea>
</div>
<button type="submit" class="btn-submit" id="submitBtn">Αποθήκευση Συμβάντος</button>
</form>
</div>

<div class="archive-container">
<div class="header-actions">
<h2>Ιστορικό Συμβάντων</h2>
<button class="btn-excel" onclick="exportToExcel()">📊 Excel</button>
</div>
<div id="eventsList">Φόρτωση...</div>
</div>

<script>
// Έτοιμη, ενεργοποιημένη online βάση δεδομένων
const DB_URL = "https://firebasedatabase.app";
let localEvents = [];

function formatDateTime(dateTimeStr) {
const dt = new Date(dateTimeStr);
return dt.toLocaleString('el-GR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute:'2-digit' });
}

// Φόρτωση από την Online βάση
function loadFromDatabase() {
document.getElementById('statusBar').innerText = "🔄 Ανανέωση...";
fetch(DB_URL)
.then(res => res.json())
.then(data => {
const eventsList = document.getElementById('eventsList');
eventsList.innerHTML = '';
localEvents = [];

if (!data) {
eventsList.innerHTML = '<div class="no-events">Δεν υπάρχουν συμβάντα στο κοινό ιστορικό.</div>';
document.getElementById('statusBar').innerText = "🟢 Online";
return;
}

// Μετατροπή των κλειδιών της Firebase σε πίνακα
const keys = Object.keys(data);
keys.reverse().forEach(key => {
const event = data[key];
event.firebaseId = key;
localEvents.push(event);

const card = document.createElement('div');
card.className = 'event-card';
const cleanDetails = event.details ? event.details.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';

card.innerHTML = `
<h3>${event.title}</h3>
<button class="btn-delete" onclick="deleteFromDatabase('${key}')">Διαγραφή</button>
<div class="event-grid">
<div><span>Ημερομηνία:</span> ${formatDateTime(event.datetime)}</div>
<div><span>Διάρκεια:</span> ${event.duration}</div>
<div><span>Όχημα:</span> ${event.vehicle}</div>
<div><span>Πλήρωμα:</span> ${event.crew}</div>
</div>
${event.details ? `<div class="event-details"><strong>Λεπτομέρειες:</strong><br>${cleanDetails}</div>` : ''}
`;
eventsList.appendChild(card);
});
document.getElementById('statusBar').innerText = "🟢 Online";
})
.catch(() => {
document.getElementById('statusBar').innerText = "🔴 Αποτυχία σύνδεσης";
});
}

// Αποθήκευση στην Online βάση
document.getElementById('eventForm').addEventListener('submit', function(e) {
e.preventDefault();
document.getElementById('statusBar').innerText = "⏳ Αποστολή...";

const newEvent = {
title: document.getElementById('eventTitle').value,
datetime: document.getElementById('eventDateTime').value,
duration: document.getElementById('eventDuration').value,
vehicle: document.getElementById('eventVehicle').value,
crew: document.getElementById('eventCrew').value,
details: document.getElementById('eventDetails').value
};

fetch(DB_URL, {
method: 'POST',
body: JSON.stringify(newEvent)
})
.then(() => {
document.getElementById('eventForm').reset();
setCurrentDateTime();
loadFromDatabase();
});
});

// Διαγραφή από την Online βάση
window.deleteFromDatabase = function(key) {
if(confirm('Σίγουρα διαγραφή;')) {
document.getElementById('statusBar').innerText = "⏳ Διαγραφή...";
const deleteUrl = `https://firebasedatabase.app{key}.json`;
fetch(deleteUrl, { method: 'DELETE' })
